 if(c){const k=c[1].toLowerCase();if(k=='me'||k=='do'){t=k;m=c[2].trim();if(!m){addLine('Kullanım: /'+k+' mesaj','#ff8080');return}}else{addLine('Komutlar: /me eylem · /do durum tarifi · T ile sohbeti aç','#ffd34d');return}}

function applyPeers(list){list.forEach(p=>{if(p.isMe)return;const d=p.presence,so=d&&san(d.o);if(!so)return;let e=peersM[p.peer];

if(window.claude&&claude.use)claude.use('room').then(r=>{if(!r)return;room=r;applyPeers(r.peers());r.onPeers(c=>{c.left.forEach(dropPeer);applyPeers(c.peers)});

 r.on('hit',m=>{const d=m.data||{};if(started&&d.t===RID)damage(Math.min(60,nn(d.d)),String(d.n||'?').slice(0,14))})}).catch(()=>{});
function mpUpdate(dt){
 if(started){if(hp<100)hp=Math.min(100,hp+3*dt);$('hp').style.width=hp+'%';lastSend+=dt;
  if(room&&lastSend>.1){lastSend=0;const r=q=>Math.round(q*100)/100;room.presence({o:sel.slice(),id:RID,w:wp,n:pname,x:r(ch.position.x),z:r(ch.position.z),r:r(ch.rotation.y),ic:inCar?1:0,cx:r(car.position.x),cz:r(car.position.z),cr:r(car.rotation.y),hp:Math.round(hp)}).catch(()=>{})}}
 for(let i=tr.length-1;i>=0;i--){tr[i].t-=dt;if(tr[i].t<=0){S.remove(tr[i].l);tr[i].l.geometry.dispose();tr.splice(i,1)}}
 for(let i=bub.length-1;i>=0;i--){const q=bub[i];q.t-=dt;q.s.position.set(q.obj.position.x,4.2,q.obj.position.z);if(q.t<=0){S.remove(q.s);bub.splice(i,1)}}
 if(started){if(reloadT>0){reloadT-=dt;if(reloadT<=0){ammo=WP[wp].mag;hud()}}if(firing&&wp==2)shoot();flash=Math.max(0,flash-dt);$('fl').style.opacity=Math.min(1,flash*2.5)}
 const k=Math.min(1,dt*10);
 for(const id in peersM){const e=peersM[id],d=e.d;if(!d)continue;
  e.g.position.x+=(nn(d.x)-e.g.position.x)*k;e.g.position.z+=(nn(d.z)-e.g.position.z)*k;e.g.rotation.y+=ad(e.g.rotation.y,nn(d.r))*k;e.g.visible=!d.ic;animate(e.g,dt,Math.min(9,Math.hypot(e.g.position.x-(e.px??e.g.position.x),e.g.position.z-(e.pz??e.g.position.z))/Math.max(dt,.001)));e.px=e.g.position.x;e.pz=e.g.position.z;const pw=Math.max(0,Math.min(2,nn(d.w)|0));if(e.w!==pw){e.w=pw;setWeapon(e.g,pw)}if(pw)armPose(e.g,pw);
  e.cr.position.x+=(nn(d.cx)-e.cr.position.x)*k;e.cr.position.z+=(nn(d.cz)-e.cr.position.z)*k;e.cr.rotation.y+=ad(e.cr.rotation.y,nn(d.cr))*k;
  const nm=String(d.n||'Oyuncu').slice(0,14),h=Math.round(nn(d.hp)),key=nm+h;
  if(key!==e.key){if(e.lab)S.remove(e.lab);e.lab=lab(nm,h);S.add(e.lab);e.key=key}
  e.lab.position.set(e.g.position.x,3.2,e.g.position.z)}
 $('on').textContent='Çevrimiçi: '+(Object.keys(peersM).length+1)}

const rx=$('rad').getContext('2d');
function radar(){const t=inCar?car.position:ch.position,s=1.1,w=190,X=x=>w/2+(x-t.x)*s,Y=z=>w/2+(z-t.z)*s;
 rx.fillStyle='#52606d';rx.fillRect(0,0,w,w);rx.strokeStyle='#c9c9bd';rx.lineWidth=10*s;rx.beginPath();
 for(let i=-N/2;i<=N/2;i++){rx.moveTo(X(i*BL),0);rx.lineTo(X(i*BL),w);rx.moveTo(0,Y(i*BL));rx.lineTo(w,Y(i*BL))}rx.stroke();
 rx.fillStyle='#3c4753';colliders.forEach(c=>rx.fillRect(X(c.x-c.w),Y(c.z-c.d),c.w*2*s,c.d*2*s));
 rx.fillStyle='#4da3ff';for(const id in peersM){const e=peersM[id];rx.beginPath();rx.arc(X(e.g.position.x),Y(e.g.position.z),4,0,7);rx.fill()}
 const r=inCar?ang:ch.rotation.y,px=w/2,py=w/2,c=Math.cos(r),sn=Math.sin(r);rx.fillStyle='#fff';rx.beginPath();
 rx.moveTo(px+sn*9,py+c*9);rx.lineTo(px-sn*5+c*6,py-c*5-sn*6);rx.lineTo(px-sn*5-c*6,py-c*5+sn*6);rx.fill()}

 traffic.forEach(t=>{const u=t.userData,s=12*dt*u.dir;if(u.hz)t.position.x+=s;else t.position.z+=s;
  if(Math.abs(t.position.x)>H+5||Math.abs(t.position.z)>H+5){if(u.hz)t.position.x*=-1;else t.position.z*=-1}});
 if(started){

   car.rotation.y=ang;car.userData.body.rotation.z=-st*Math.min(1,Math.abs(v)/40)*.06;$('spd').textContent=Math.round(Math.abs(v)*3.6);ch.position.copy(car.position);
  }else{const f=(K.KeyW?1:0)-(K.KeyS?1:0),s=(K.KeyD?1:0)-(K.KeyA?1:0),sp=K.ShiftLeft?9:4.5,
    d=new THREE.Vector3(-Math.sin(yaw)*f+Math.cos(yaw)*s,0,-Math.cos(yaw)*f-Math.sin(yaw)*s),U=ch.userData;
   if(d.lengthSq()>0){d.normalize();const nx=ch.position.x+d.x*sp*dt,nz=ch.position.z+d.z*sp*dt;
    if(!hit(nx,ch.position.z,.4))ch.position.x=nx;if(!hit(ch.position.x,nz,.4))ch.position.z=nz;
    ch.rotation.y+=ad(ch.rotation.y,Math.atan2(d.x,d.z))*Math.min(1,dt*12);mvS=sp}
   else mvS=0;animate(ch,dt,mvS);if(wp){ch.rotation.y+=ad(ch.rotation.y,yaw+Math.PI)*Math.min(1,dt*14);armPose(ch,wp)}
   $('spd').textContent=ch.position.distanceTo(car.position)<5?'E':''}
  const tgt=inCar?car.position:ch.position,dist=inCar?9:5.5,cy=inCar?ang+Math.PI:yaw,cp=inCar?.28:pitch;
  C.position.lerp(new THREE.Vector3(tgt.x+Math.sin(cy)*dist*Math.cos(cp),tgt.y+2+Math.sin(cp)*dist,tgt.z+Math.cos(cy)*dist*Math.cos(cp)),inCar?.12:.3);C.lookAt(tgt.x,tgt.y+1.4,tgt.z);

 else{pvc.rotation.y+=dt*.6;animate(pvc,dt,0);C.position.set(PV.x,1.4,PV.z+4.2);C.lookAt(PV.x-1.4,1.1,PV.z);sun.position.set(PV.x+6,12,PV.z+8);sun.target.position.copy(PV)}
